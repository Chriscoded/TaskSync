version: "3.9"

services:

  postgres:

    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: TaskSync

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:

    build: .

    depends_on:
      - postgres

    ports:
      - "5000:8080"

volumes:

  postgres-data: